# File Purpose: Configure deterministic, JDK 21-compatible Android builds.
# Primary Functions: Set Gradle memory, AndroidX behavior, and Kotlin style.
# Inputs/Outputs: Read by Gradle; affects build execution only.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
