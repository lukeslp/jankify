#
# File Purpose: Pin and verify the Gradle runtime used by Jankify Android.
# Primary Functions: Download Gradle 8.14.5 and store it in the user wrapper cache.
# Inputs/Outputs: Read by wrapper scripts; resolves the declared Gradle distribution.
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
