name: Jankify

options:
  bundleIdPrefix: com.lukesteuber.jankify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 596T7J7FB6
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Jankify:
    type: application
    platform: iOS
    sources:
      - path: Jankify
    info:
      path: Jankify/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.jankify
        PRODUCT_NAME: Jankify
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  JankifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JankifyTests
    dependencies:
      - target: Jankify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukesteuber.jankify.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Jankify:
    build:
      targets:
        Jankify: all
        JankifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JankifyTests
